[package]
name = "hal"
version = "0.1.0"
edition = "2024"

[lib]
test = false
bench = false

[lints.cargo]
unused_dependencies = "allow" # acpica_sys is not used in architectures that dont support it

[features]
default = []

board-qemu-virt = ["driver-pl011", "driver-fw-cfg", "driver-ramfb", "driver-gic-v2", "driver-virtio-input"]
board-rk3126 = ["driver-dw-8250", "driver-rk3126-cru", "driver-rk3126-vop"]
board-qemu-x64 = ["driver-ns16550", "driver-i8042"]

driver-pl011 = []
driver-gic-v2 = []
driver-fw-cfg = []
driver-ramfb = ["driver-fw-cfg"]
driver-dw-8250 = []
driver-ns16550 = []
driver-i8042 = []
driver-virtio-mmio = []
driver-virtio-input = ["driver-virtio-mmio"]
driver-rk3126-cru = []
driver-rk3126-vop = ["driver-rk3126-cru"]


# ACPICA is only built for x86_64 (the only target with ACPI so far); the
# other architectures need neither clang nor libclang.
[dependencies]
acpica-sys = { path = "../acpica-sys" }
