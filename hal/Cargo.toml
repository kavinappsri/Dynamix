[package]
name = "hal"
version = "0.1.0"
edition = "2024"

[lib]
test = false
bench = false

[features]
default = []

board-qemu-virt = ["driver-pl011", "driver-fw-cfg", "driver-ramfb", "driver-gic-v2"]
board-rk3126 = ["driver-dw-8250", "driver-rk3126-cru", "driver-rk3126-vop"]
board-qemu-x64 = ["driver-ns16550"]

driver-pl011 = []
driver-gic-v2 = []
driver-fw-cfg = []
driver-ramfb = ["driver-fw-cfg"]
driver-dw-8250 = []
driver-ns16550 = []
driver-rk3126-cru = []
driver-rk3126-vop = ["driver-rk3126-cru"]


# ACPICA is only built for x86_64 (the only target with ACPI so far); the
# other architectures need neither clang nor libclang.
[target.'cfg(target_arch = "x86_64")'.dependencies]
acpica-sys = { path = "../acpica-sys" }
